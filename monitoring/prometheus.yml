# =============================================================================
# Prometheus Configuration for Dakera
# =============================================================================
# Used by:
#   - monitoring/docker-compose.yml  (standalone monitoring stack)
#   - docker/docker-compose.yml      (--profile monitoring)
# The 3-node HA stack uses prometheus.ha.yml (its nodes are dakera-1..3).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerting-rules.yml
  - /etc/prometheus/dakera.rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Dakera single-node (docker-compose.yml default setup)
  - job_name: 'dakera'
    static_configs:
      - targets: ['dakera:3000']
        labels:
          deployment: 'single-node'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # HA cluster nodes (docker-compose.ha.yml): see prometheus.ha.yml.

  # MinIO metrics
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'
    scrape_interval: 30s

  # Traefik metrics (HA profile only)
  # - job_name: 'traefik'
  #   static_configs:
  #     - targets: ['traefik:8080']
  #   metrics_path: '/metrics'
