# Dakera Development Docker Compose
# Lightweight setup for local development and testing

services:
  # ==========================================================================
  # MinIO - S3-Compatible Object Storage (Development)
  # ==========================================================================
  minio:
    # minio/minio and minio/mc are no longer published on Docker Hub (the repositories
    # are gone; a fresh `docker compose pull` fails). Chainguard's MinIO build is
    # maintained and ships `mc`. Root, as minio/minio ran: a minio-data volume written
    # by the old image stays writable.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    container_name: dakera-dev-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Web Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-dev-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dev-net

  # ==========================================================================
  # MinIO Setup - Create bucket on startup
  # ==========================================================================
  minio-setup:
    # The MinIO image above (it has a shell and `mc`); minio/mc is no longer published.
    image: cgr.dev/chainguard/minio:latest
    container_name: dakera-dev-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/dakera --ignore-existing;
      exit 0;
      "
    networks:
      - dev-net

volumes:
  minio-dev-data:
    driver: local

networks:
  dev-net:
    driver: bridge
