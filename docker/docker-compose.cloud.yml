# =============================================================================
# Dakera Cloud overlay — the multi-tenant engine behind a Cloudflare Tunnel
# =============================================================================
# On top of docker-compose.yml, for the server that runs Dakera Cloud
# (cloud.dakera.ai / api.dakera.ai). Design: dakera-cloud/docs/SCOPE.md §6.
#
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml \
#     --profile monitoring up -d
#
# What it changes:
#   * cloudflared ×2 dial out to Cloudflare; nothing listens on a public port.
#     Ingress (hostnames → services) is cloudflared/config.yml.
#   * Engine settings for a shared server: bounded rerank cost, every request
#     answered well inside Cloudflare's 125 s proxy timeout, no telemetry
#     beacon. /metrics stays open on dakera-net for Prometheus; the tunnel
#     never routes it (nor /admin, /internal) from the internet.
#
# Needs, next to this file:
#   cloudflared/config.yml           (from config.yml.example)
#   cloudflared/<tunnel-id>.json     (`cloudflared tunnel create dakera-cloud`)
# and in .env: DAKERA_ROOT_API_KEY (as for docker-compose.yml).
# Runbook: ../docs/cloud.md
# =============================================================================

services:
  dakera:
    environment:
      # A recall reranks at most this many candidates: bounded CPU per call on
      # shared hardware (the AML runs: 20 candidates kept quality, 3× faster).
      - DAKERA_RERANK_MAX_CANDIDATES=${DAKERA_RERANK_MAX_CANDIDATES:-30}
      # Cloudflare answers 524 after 125 s; answer first.
      - DAKERA_REQUEST_TIMEOUT=${DAKERA_REQUEST_TIMEOUT:-90}
      - DAKERA_ADMISSION_WAIT_SECS=${DAKERA_ADMISSION_WAIT_SECS:-20}
      - DAKERA_TELEMETRY=${DAKERA_TELEMETRY:-0}

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - dakera-net
    depends_on:
      dakera:
        condition: service_healthy
