services:
  dakera:
    image: ${DAKERA_IMAGE:-ghcr.io/dakera-ai/dakera:0.12.0}
    ports:
      - "3000:3000"
      - "50051:50051"
    environment:
      - RUST_LOG=info
      - DAKERA_HOST=0.0.0.0
      - DAKERA_PORT=3000
      - DAKERA_GRPC_PORT=50051
      - DAKERA_STORAGE=memory
    healthcheck:
      # 503 while the models load (the port answers meanwhile); the first
      # success ends the start period.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s
    restart: unless-stopped

  # Optional: MinIO for S3-compatible storage testing
  minio:
    # minio/minio and minio/mc are no longer published on Docker Hub (the repositories
    # are gone; a fresh `docker compose pull` fails). Chainguard's MinIO build is
    # maintained and ships `mc`. Root, as minio/minio ran: a minio-data volume written
    # by the old image stays writable.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  minio-data:
