# Traefik Dynamic Configuration for Dakera HA
# File-based configuration to avoid Docker provider API version issues

http:
  # Idle keep-alive connections to the nodes are closed by Traefik after 25 s. A
  # Dakera server closes a keep-alive connection that sends no request head for
  # DAKERA_HTTP_HEADER_READ_TIMEOUT_SECS (default 30, server v0.12.3);
  # Traefik's default (90 s) would reuse connections the server already closed, and
  # a request sent on one fails (502). Keep this below the server's value.
  serversTransports:
    dakera-nodes:
      forwardingTimeouts:
        idleConnTimeout: "25s"

  # Services define the backend servers
  services:
    dakera-http:
      loadBalancer:
        serversTransport: dakera-nodes
        servers:
          - url: "http://dakera-1:3000"
          - url: "http://dakera-2:3000"
          - url: "http://dakera-3:3000"
        healthCheck:
          path: /health
          interval: "5s"
          timeout: "3s"

    dakera-grpc:
      loadBalancer:
        servers:
          - url: "h2c://dakera-1:50051"
          - url: "h2c://dakera-2:50051"
          - url: "h2c://dakera-3:50051"

  # Routers define how to match requests
  routers:
    dakera-http:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - http
      service: dakera-http

    dakera-grpc:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - grpc
      service: dakera-grpc
