services:
  dakera:
    image: ${DAKERA_IMAGE:-ghcr.io/dakera-ai/dakera:0.12.3}
    ports:
      - "127.0.0.1:3200:3000"
      - "127.0.0.1:51051:50051"
    environment:
      - RUST_LOG=info
      - DAKERA_HOST=0.0.0.0
      - DAKERA_PORT=3000
      - DAKERA_GRPC_PORT=50051
      - DAKERA_STORAGE=memory
      - DAKERA_AUTH_ENABLED=false
      # Auth off: from server 0.12.3 a request whose Host is a dotted name (not localhost,
      # an IP or a single-label name such as `dakera`) is refused with 421 unless the name
      # is listed here (DNS-rebinding guard). Set it if you reach this stack by such a name.
      - DAKERA_ALLOWED_HOSTS
    healthcheck:
      # Works with every image: up to v0.12.2 curl (no `dakera healthcheck`: an
      # unknown argument would start a second server), later `dakera healthcheck`.
      test: ["CMD-SHELL", "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:3000/health/ready >/dev/null; else dakera healthcheck /health/ready; fi"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
