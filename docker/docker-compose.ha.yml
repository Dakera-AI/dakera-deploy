# =============================================================================
# Dakera - High Availability Cluster
# =============================================================================
# Full production-like stack: 3-node cluster with load balancer, object storage
# (one bucket per node), monitoring, and dashboard.
#
# All services use published container images — no local builds required.
#
# IMPORTANT: This file sets `name: dakera-ha` to isolate it from the single-node
# stack (docker-compose.yml, project name: dakera). Without this, both stacks
# share the same Compose project name and Docker reconciliation removes each
# other's containers on `up` — causing the MinIO/network interference (DAK-829).
#
# Usage:
#   docker compose -f docker-compose.ha.yml up -d
#   docker compose -f docker-compose.ha.yml --profile monitoring up -d
#   docker compose -f docker-compose.ha.yml --profile full up -d
#   docker compose -f docker-compose.ha.yml down
#
# Endpoints (default HA_ port overrides — safe for single-server co-deployment):
#   Dakera API (LB):   http://localhost:3100   (HA_LB_HTTP_PORT)
#   Dakera gRPC (LB):  localhost:50151          (HA_LB_GRPC_PORT)
#   Dashboard:          http://localhost:3202   (HA_DASHBOARD_PORT)
#   Traefik Dashboard:  http://localhost:8080   (HA_TRAEFIK_PORT)
#   MinIO API:          http://localhost:9100   (HA_MINIO_API_PORT)
#   MinIO Console:      http://localhost:9101   (HA_MINIO_CONSOLE_PORT)
#   Prometheus:         http://localhost:9190   (--profile monitoring, HA_PROMETHEUS_PORT)
#   Grafana:            http://localhost:3203   (--profile monitoring, HA_GRAFANA_PORT)
#   Jaeger UI:          http://localhost:16787  (--profile monitoring, HA_JAEGER_UI_PORT)
#
# Override any port by setting the corresponding HA_* env var. See .env.ha.example.
#
# Dakera v0.12.1. (v0.11 users: the previous version of this file is on the
# `release/0.11` branch.)
#
# v0.12 cluster requirements:
#   * DAKERA_CLUSTER_SECRET (>= 16 characters, identical on every node; generate
#     with `openssl rand -hex 32`) and a stable DAKERA_CLUSTER_NODE_ID. From 0.12.1
#     a node without the secret exits with code 78, fresh install or upgraded, so
#     this file has no default for it: set it in the env file you start with.
#   * Each node has its OWN bucket (dakera, dakera-2, dakera-3). Nodes sharing
#     one bucket are refused on a fresh install and `shared_store`-degraded on an
#     existing one. dakera-1 keeps `dakera`, so v0.11 data stays where it is;
#     dakera-2 / dakera-3 start empty and fill from their peers (watch
#     GET /admin/cluster/status: replication.startup_reconciled).
#
# Upgrading from v0.12.0 or v0.11.108 (README "Upgrading from v0.12.0 to v0.12.1";
# server UPGRADE.md, "Cluster secret"): ONE window for all three nodes. Nodes with
# and without the secret do not see each other, and a cluster that ran without it
# must not run half-and-half. Back up, set DAKERA_CLUSTER_SECRET, pull, check the
# config with the new image
#   docker compose -f docker-compose.ha.yml pull
#   docker compose -f docker-compose.ha.yml run --rm --no-deps dakera-1 --check-config
# then `docker compose -f docker-compose.ha.yml down` (volumes kept) and `up -d`.
#
# Going back to v0.11.108: roll back the WHOLE cluster, never one node. Wait until
# every node's sync outbox is empty (GET /admin/cluster/status), stop every node,
# run downgrade on each (it needs MinIO up), start v0.11.108 everywhere:
#   docker compose -f docker-compose.ha.yml stop dakera-1 dakera-2 dakera-3 dashboard traefik
#   for n in dakera-1 dakera-2 dakera-3; do
#     docker compose -f docker-compose.ha.yml run --rm --no-deps $n downgrade
#   done        # --no-deps: keep it from starting other nodes; minio must be running
# =============================================================================

name: dakera-ha

x-dakera-common: &dakera-common
  image: ${DAKERA_IMAGE:-ghcr.io/dakera-ai/dakera:0.12.1}
  restart: unless-stopped
  # SIGTERM starts the graceful shutdown (running media-job stores are waited for up to
  # 15 s, then the final flushes); compose's default of 10 s would kill it first.
  stop_grace_period: 30s
  ulimits:
    nofile:
      soft: 65536
      hard: 1048576
  networks:
    - dakera-ha-net
  expose:
    - "3000"
    - "50051"
    - "7946"
  healthcheck:
    # /health/ready is 503 while the models load (the port answers meanwhile);
    # failures inside the start period do not count, the first success ends it.
    test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 600s

x-dakera-env: &dakera-env
  DAKERA_HOST: "0.0.0.0"
  DAKERA_PORT: "3000"
  DAKERA_GRPC_PORT: "50051"
  DAKERA_CLUSTER_MODE: "true"
  DAKERA_GOSSIP_PORT: "7946"
  # Shared secret of the node-to-node routes (/internal/*) and gossip: required on
  # every cluster node from 0.12.1 (exit 78 without it, upgraded or not), at least
  # 16 characters, identical on every node (openssl rand -hex 32). Nodes with and
  # without it do not see each other: set it and upgrade all nodes in one window
  # (server UPGRADE.md, "Cluster secret (required from 0.12.1)").
  DAKERA_CLUSTER_SECRET: "${DAKERA_CLUSTER_SECRET:?Set DAKERA_CLUSTER_SECRET (>= 16 chars, same on every node: openssl rand -hex 32) in .env or .env.ha (see .env.ha.example); a 0.12.1 cluster node exits 78 without it}"
  # Data root: write-ahead log, knowledge graph (/data/graph.db), hot tier
  # (/data/hot) and warm tier (/data/cache/warm) derive from it.
  DAKERA_STORAGE_PATH: "/data"
  # Storage — MinIO, one bucket per node (set per node below)
  DAKERA_STORAGE: "s3"
  DAKERA_S3_ENDPOINT: "http://minio:9000"
  AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
  AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  DAKERA_S3_REGION: "us-east-1"
  # Cache
  # Hot-tier byte budget (tiered storage); a bare number below 10 million would be a vector count.
  DAKERA_L1_CACHE_SIZE: "${DAKERA_L1_CACHE_SIZE:-512MB}"
  # No DAKERA_REDIS_URL: with one Redis shared by the three nodes, v0.12.0's
  # replication applied nothing (a peer's write was reported "written=0" because
  # the shared cache already held that version), so a write on one node never
  # reached some of the others. Measured on 0.12.0: with the shared Redis, 3 of 6
  # node pairs never converged (300 s); without it, all 6 within 0.1 s. Leader
  # election does not use Redis (HTTP vote between nodes). Rate limits are per node.
  # Tiered storage (L1 hot → L2 warm → L3 cold)
  DAKERA_TIERED_STORAGE: "${DAKERA_TIERED_STORAGE:-true}"
  DAKERA_HOT_TO_WARM_SECS: "${DAKERA_HOT_TO_WARM_SECS:-3600}"
  DAKERA_WARM_TO_COLD_SECS: "${DAKERA_WARM_TO_COLD_SECS:-86400}"
  DAKERA_AUTO_TIER: "${DAKERA_AUTO_TIER:-true}"
  DAKERA_TIER_CHECK_INTERVAL_SECS: "${DAKERA_TIER_CHECK_INTERVAL_SECS:-300}"
  # DAK-6209/DAK-6284: tiered embeddings ON. Must be IDENTICAL on all nodes (they
  # replicate vectors to each other; the tiered engine always embeds with the
  # default model and ignores DAKERA_MODEL; a node whose effective model differs
  # from the store's refuses to start).
  DAKERA_TIERED: "${DAKERA_TIERED:-1}"
  DAKERA_SEARCH_MODE: "${DAKERA_SEARCH_MODE:-hybrid}"
  # Request limits
  DAKERA_MAX_BODY_SIZE: "${DAKERA_MAX_BODY_SIZE:-524288000}"
  DAKERA_REQUEST_TIMEOUT: "${DAKERA_REQUEST_TIMEOUT:-120}"
  # Auth: on by default, as in docker-compose.yml (the load balancer port is published
  # on every interface; with it off, any client that reaches it is a SuperAdmin).
  DAKERA_AUTH_ENABLED: "${DAKERA_AUTH_ENABLED:-true}"
  DAKERA_ROOT_API_KEY: "${DAKERA_ROOT_API_KEY:?Set DAKERA_ROOT_API_KEY in .env (see .env.ha.example)}"
  # Model downloads behind a proxy / mirror, or none at all (air-gapped). All empty
  # = unset = the Hugging Face Hub, directly (.env.ha.example, "Model downloads").
  # Settings documented in .env.ha.example / .env.example. Compose passes ONLY what is listed here
  # (a variable in .env that is not, never reaches the container); empty = unset = the server's
  # default. DAKERA_ENCRYPTION_KEY must be the SAME on every node.
  DAKERA_ENCRYPTION_KEY: "${DAKERA_ENCRYPTION_KEY:-}"
  DAKERA_HYBRID_FETCH_MULT: "${DAKERA_HYBRID_FETCH_MULT:-}"
  DAKERA_BM25_K1: "${DAKERA_BM25_K1:-}"
  DAKERA_BM25_B: "${DAKERA_BM25_B:-}"
  DAKERA_BM25_DELTA: "${DAKERA_BM25_DELTA:-}"
  DAKERA_RRF_K: "${DAKERA_RRF_K:-}"
  DAKERA_FUSION_STRATEGY: "${DAKERA_FUSION_STRATEGY:-}"
  DAKERA_TEMPORAL_RERANK_GAMMA: "${DAKERA_TEMPORAL_RERANK_GAMMA:-}"
  DAKERA_ADAPTIVE_WVEC_BOOST: "${DAKERA_ADAPTIVE_WVEC_BOOST:-}"
  DAKERA_ADAPTIVE_WVEC_THRESHOLD: "${DAKERA_ADAPTIVE_WVEC_THRESHOLD:-}"
  DAKERA_PPR_FUSION: "${DAKERA_PPR_FUSION:-}"
  DAKERA_BITEMPORAL_WEIGHT: "${DAKERA_BITEMPORAL_WEIGHT:-}"
  DAKERA_NAME_BOOST: "${DAKERA_NAME_BOOST:-}"
  DAKERA_SUPERSEDE_DEMOTE: "${DAKERA_SUPERSEDE_DEMOTE:-}"
  DAKERA_RERANK_MAX_CANDIDATES: "${DAKERA_RERANK_MAX_CANDIDATES:-}"
  DAKERA_HOT_TIER: "${DAKERA_HOT_TIER:-}"
  DAKERA_ROCKSDB_SYNC: "${DAKERA_ROCKSDB_SYNC:-}"
  DAKERA_HNSW_CACHE_TTI_SECS: "${DAKERA_HNSW_CACHE_TTI_SECS:-}"
  DAKERA_RATE_LIMIT_RPS: "${DAKERA_RATE_LIMIT_RPS:-}"
  DAKERA_RATE_LIMIT_BURST: "${DAKERA_RATE_LIMIT_BURST:-}"
  # gRPC listener: an EMPTY value would read as OFF on an upgraded deployment (v0.11's reading).
  DAKERA_GRPC_ENABLED: "${DAKERA_GRPC_ENABLED:-true}"
  HF_TOKEN: "${HF_TOKEN:-}"
  HF_ENDPOINT: "${HF_ENDPOINT:-}"
  HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-}"
  HTTPS_PROXY: "${HTTPS_PROXY:-}"
  HTTP_PROXY: "${HTTP_PROXY:-}"
  ALL_PROXY: "${ALL_PROXY:-}"
  NO_PROXY: "${NO_PROXY:-}"
  # Logging
  RUST_LOG: "${RUST_LOG:-info,dakera=debug}"

services:
  # ==========================================================================
  # Traefik — Load Balancer
  # ==========================================================================
  traefik:
    image: traefik:latest
    container_name: dakera-lb
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.http.address=:3000"
      - "--entrypoints.grpc.address=:50051"
      - "--ping=true"
      - "--ping.entrypoint=http"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "${HA_LB_HTTP_PORT:-3100}:3000"
      - "${HA_LB_GRPC_PORT:-50151}:50051"
      - "${HA_TRAEFIK_PORT:-8080}:8080"
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      dakera-ha-net:
        aliases:
          - dakera-traefik
    depends_on:
      minio:
        condition: service_healthy

  # ==========================================================================
  # Dakera Node 1 (Primary)
  # ==========================================================================
  dakera-1:
    <<: *dakera-common
    container_name: dakera-1
    hostname: dakera-1
    environment:
      <<: *dakera-env
      DAKERA_CLUSTER_NODE_ID: "node-1"
      DAKERA_S3_BUCKET: "dakera"
      DAKERA_CLUSTER_ROLE: "primary"
      DAKERA_CLUSTER_SEEDS: "dakera-2:7946,dakera-3:7946"
      DAKERA_GOSSIP_BIND: "0.0.0.0:7946"
      DAKERA_API_ADVERTISE: "http://dakera-1:3000"
    volumes:
      # The data root, plus the hot and warm tiers on the volumes they had
      # before v0.12, mounted where the root derives them.
      - dakera-1-data:/data
      - dakera-1-rocksdb:/data/hot
      - dakera-1-cache:/data/cache/warm
      # One model cache for the three nodes: a model downloads once.
      - dakera-models:/app/models
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  # ==========================================================================
  # Dakera Node 2 (Replica)
  # ==========================================================================
  dakera-2:
    <<: *dakera-common
    container_name: dakera-2
    hostname: dakera-2
    environment:
      <<: *dakera-env
      DAKERA_CLUSTER_NODE_ID: "node-2"
      DAKERA_S3_BUCKET: "dakera-2"
      DAKERA_CLUSTER_ROLE: "replica"
      DAKERA_CLUSTER_SEEDS: "dakera-1:7946,dakera-3:7946"
      DAKERA_GOSSIP_BIND: "0.0.0.0:7946"
      DAKERA_API_ADVERTISE: "http://dakera-2:3000"
    volumes:
      # The data root, plus the hot and warm tiers on the volumes they had
      # before v0.12, mounted where the root derives them.
      - dakera-2-data:/data
      - dakera-2-rocksdb:/data/hot
      - dakera-2-cache:/data/cache/warm
      # One model cache for the three nodes: a model downloads once.
      - dakera-models:/app/models
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      dakera-1:
        condition: service_healthy

  # ==========================================================================
  # Dakera Node 3 (Replica)
  # ==========================================================================
  dakera-3:
    <<: *dakera-common
    container_name: dakera-3
    hostname: dakera-3
    environment:
      <<: *dakera-env
      DAKERA_CLUSTER_NODE_ID: "node-3"
      DAKERA_S3_BUCKET: "dakera-3"
      DAKERA_CLUSTER_ROLE: "replica"
      DAKERA_CLUSTER_SEEDS: "dakera-1:7946,dakera-2:7946"
      DAKERA_GOSSIP_BIND: "0.0.0.0:7946"
      DAKERA_API_ADVERTISE: "http://dakera-3:3000"
    volumes:
      # The data root, plus the hot and warm tiers on the volumes they had
      # before v0.12, mounted where the root derives them.
      - dakera-3-data:/data
      - dakera-3-rocksdb:/data/hot
      - dakera-3-cache:/data/cache/warm
      # One model cache for the three nodes: a model downloads once.
      - dakera-models:/app/models
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      dakera-1:
        condition: service_healthy

  # ==========================================================================
  # MinIO — S3-Compatible Object Storage (one bucket per node)
  # ==========================================================================
  minio:
    # minio/minio and minio/mc are no longer published on Docker Hub (the repositories
    # are gone; a fresh `docker compose pull` fails). Chainguard's MinIO build is
    # maintained and ships `mc`. Root, as minio/minio ran: a minio-data volume written
    # by the old image stays writable.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    container_name: dakera-ha-minio
    command: server /data --console-address ":9001"
    ports:
      - "${HA_MINIO_API_PORT:-9100}:9000"
      - "${HA_MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      # Lets Prometheus (monitoring profile) scrape /minio/v2/metrics/cluster; without it: 403.
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - dakera-ha-net

  # ==========================================================================
  # MinIO Setup — Create the buckets (one per node) on startup
  # ==========================================================================
  minio-setup:
    # The MinIO image above (it has a shell and `mc`); minio/mc is no longer published.
    image: cgr.dev/chainguard/minio:latest
    container_name: dakera-ha-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    # The credentials MinIO was started with (see docker-compose.yml, minio-setup).
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/dakera --ignore-existing;
      mc mb myminio/dakera-2 --ignore-existing;
      mc mb myminio/dakera-3 --ignore-existing;
      echo 'Dakera buckets ready';
      exit 0;
      "
    networks:
      - dakera-ha-net

  # ==========================================================================
  # Dakera Dashboard — Web UI
  # ==========================================================================
  dashboard:
    # 0.5.0 (deploys like 0.4.0): operators sign in at /login with their OWN Dakera
    # API key (kept in server memory by the dashboard's session service);
    # DAKERA_API_KEY and DAKERA_CLIENT_URL are gone since 0.4.0. Serve it behind TLS
    # that forwards X-Forwarded-Proto and Host (README, "Dashboard 0.5.0", TLS in front).
    image: ${DASHBOARD_IMAGE:-ghcr.io/dakera-ai/dakera-dashboard:0.5.0}
    container_name: dakera-dashboard
    ports:
      - "${HA_DASHBOARD_PORT:-3202}:3000"
    environment:
      - DAKERA_API_UPSTREAM=http://dakera-traefik:3000
      # Longest a sign-in lasts (default 12; idle sessions end after 2 h):
      - DAKERA_SESSION_TTL_HOURS=${DAKERA_SESSION_TTL_HOURS:-12}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/_session/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      dakera-1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dakera-ha-net

  # ==========================================================================
  # Prometheus — Metrics Collection (optional)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: dakera-prometheus
    profiles: ["monitoring", "full"]
    ports:
      - "${HA_PROMETHEUS_PORT:-9190}:9090"
    volumes:
      # The HA config scrapes dakera-1..3 (job "dakera", which the rules match).
      - ../monitoring/prometheus.ha.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - ../monitoring/dakera.rules.yml:/etc/prometheus/dakera.rules.yml:ro
      - ../monitoring/alerting-rules.ha.yml:/etc/prometheus/alerting-rules.ha.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - dakera-ha-net

  # ==========================================================================
  # Grafana — Dashboards & Visualization (optional)
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: dakera-grafana
    profiles: ["monitoring", "full"]
    ports:
      - "${HA_GRAFANA_PORT:-3203}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - dakera-ha-net

  # ==========================================================================
  # Jaeger — Distributed Tracing (optional)
  # ==========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: dakera-jaeger
    profiles: ["monitoring", "full"]
    ports:
      - "${HA_JAEGER_UI_PORT:-16787}:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - dakera-ha-net

volumes:
  dakera-1-data:
  dakera-1-cache:
  dakera-1-rocksdb:
  dakera-2-data:
  dakera-2-cache:
  dakera-2-rocksdb:
  dakera-3-data:
  dakera-3-cache:
  dakera-3-rocksdb:
  dakera-models:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  dakera-ha-net:
    driver: bridge
