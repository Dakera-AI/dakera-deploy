# Dakera v0.12.0 on Kubernetes: multilingual search + attachments and speech to text.
#   kubectl apply -k k8s-features/overlays/multilingual-multimodal
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../k8s

components:
  - ../../components/models-cache
  - ../../components/multilingual
  - ../../components/multimodal
