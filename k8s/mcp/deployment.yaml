# =============================================================================
# Dakera MCP Server - Kubernetes Deployment
# =============================================================================
# The MCP server exposes Dakera memory tools to AI agents via the
# Model Context Protocol (MCP). One instance per cluster is sufficient.
# NOT applied by kustomization.yaml: dakera-mcp speaks MCP over stdio only.
# 0.12.0: distroless/static image, runs as uid 65532 (was the `dakera` user),
# no shell (no `kubectl exec ... sh`); the tools are unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dakera-mcp
  namespace: dakera
  labels:
    app.kubernetes.io/name: dakera-mcp
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dakera-mcp
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dakera-mcp
        app.kubernetes.io/component: mcp
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: dakera-mcp
          image: ghcr.io/dakera-ai/dakera-mcp:0.12.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            # The variable dakera-mcp reads (it falls back to http://localhost:3000).
            - name: DAKERA_API_URL
              value: "http://dakera:3000"
            - name: DAKERA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dakera-secrets
                  key: DAKERA_ROOT_API_KEY
            - name: MCP_PORT
              value: "3001"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
