# =============================================================================
# Dakera - Kubernetes ConfigMap (non-secret configuration)
# =============================================================================
# Secrets (API keys, passwords) belong in a Secret — see secret.example.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dakera-config
  namespace: dakera
  labels:
    app.kubernetes.io/name: dakera
    app.kubernetes.io/component: config
data:
  DAKERA_HOST: "0.0.0.0"
  DAKERA_PORT: "3000"
  DAKERA_GRPC_PORT: "50051"
  DAKERA_STORAGE: "s3"
  DAKERA_S3_ENDPOINT: "http://dakera-minio:9000"
  DAKERA_S3_BUCKET: "dakera"
  DAKERA_S3_REGION: "us-east-1"
  DAKERA_L1_CACHE_SIZE: "1GB"
  # The data root: every local path (WAL, graph, hot/warm tiers) derives from it.
  # Replaces DAKERA_L2_CACHE_PATH, which v0.12 no longer reads.
  DAKERA_STORAGE_PATH: "/data"
  DAKERA_TIERED_STORAGE: "true"
  DAKERA_HOT_TO_WARM_SECS: "3600"
  DAKERA_WARM_TO_COLD_SECS: "86400"
  DAKERA_AUTO_TIER: "true"
  DAKERA_TIER_CHECK_INTERVAL_SECS: "300"
  # DAK-6209/DAK-6284: tiered embeddings ON (the published image has the static
  # model baked in). Must be identical on every node sharing a store.
  DAKERA_TIERED: "1"
  DAKERA_SEARCH_MODE: "hybrid"
  DAKERA_MAX_BODY_SIZE: "524288000"
  DAKERA_REQUEST_TIMEOUT: "120"
  DAKERA_AUTH_ENABLED: "true"
  RUST_LOG: "info"
  # Server releases after v0.12.2 (an older image reports these names as unknown):
  # request-head deadline on the REST port, which also closes idle keep-alive
  # connections (default 30; see ingress.yaml for proxies that keep idle connections).
  # DAKERA_HTTP_HEADER_READ_TIMEOUT_SECS: "30"
  # Recall defaults (docker/.env.example, "Recall and connections"):
  # DAKERA_NEIGHBORHOOD_MODE: "inline"
  # DAKERA_RECALL_RANK_DEPTH: "10"
