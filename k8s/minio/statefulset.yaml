# =============================================================================
# MinIO - Kubernetes StatefulSet
# =============================================================================
# For cloud deployments, prefer native S3 (AWS) or GCS over self-hosted MinIO.
# Use this for on-prem / bare-metal clusters.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dakera-minio
  namespace: dakera
  labels:
    app.kubernetes.io/name: dakera-minio
    app.kubernetes.io/component: storage
spec:
  serviceName: dakera-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dakera-minio
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dakera-minio
        app.kubernetes.io/component: storage
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: minio
          # minio/minio and minio/mc are no longer published on Docker Hub (the
          # repositories are gone). Chainguard's maintained MinIO build ships `mc`.
          # Root, as minio/minio ran: a volume written by the old image stays writable.
          image: cgr.dev/chainguard/minio:latest
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: dakera-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dakera-secrets
                  key: MINIO_ROOT_PASSWORD
            # Lets k8s/monitoring's Prometheus scrape /minio/v2/metrics/cluster (403 otherwise).
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          # Creates the server's bucket once MinIO answers. (It was an init container
          # waiting for this same MinIO, which only starts after init containers
          # finish: the pod never started.)
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    i=0; until mc --config-dir /tmp/.mc alias set local http://127.0.0.1:9000
                    "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1;
                    do i=$((i+1)); [ "$i" -ge 120 ] && exit 1; sleep 1; done;
                    mc --config-dir /tmp/.mc mb --ignore-existing local/dakera
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
