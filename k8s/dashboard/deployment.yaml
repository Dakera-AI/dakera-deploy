# =============================================================================
# Dakera Dashboard - Kubernetes Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dakera-dashboard
  namespace: dakera
  labels:
    app.kubernetes.io/name: dakera-dashboard
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/version: "0.5.1"
spec:
  # One replica: sessions live in the pod's memory. More replicas need sticky
  # sessions at the ingress, otherwise users are signed out when a request lands
  # on another pod.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dakera-dashboard
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dakera-dashboard
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/version: "0.5.1"
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/dakera-ai/dakera-dashboard:0.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DAKERA_API_UPSTREAM
              value: "http://dakera:3000"
            # Since 0.4.0: no API key on the dashboard. Operators sign in at /login with their
            # own key, kept in server memory (DAKERA_API_KEY / DAKERA_CLIENT_URL are gone).
            # Optional: longest a sign-in lasts, in hours (default 12; idle ends after 2 h).
            # - name: DAKERA_SESSION_TTL_HOURS
            #   value: "12"
          # 0.5.1 starts as root; nginx and the session service drop to their own users.
          # Only the capabilities that needs (measured with 0.5.1); a non-root image
          # needs none of them.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
          livenessProbe:
            httpGet:
              path: /_session/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_session/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
